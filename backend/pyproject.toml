[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-workflow-backend"
version = "0.1.0"
description = "Secure, auditable, human-approved business workflow automation"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic==1.20.1",
  "boto3==1.43.122",
  "celery==5.6.3",
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "langgraph==1.2.18",
  "langgraph-checkpoint-postgres==3.2.0",
  "opentelemetry-exporter-otlp-proto-http==1.45.2",
  "opentelemetry-instrumentation-fastapi==0.66b2",
  "opentelemetry-sdk==1.45.2",
  "prometheus-client==0.26.0",
  "psycopg[binary]==3.3.6",
  "pydantic==2.14.2",
  "pydantic-settings==2.16.2",
  "PyJWT[crypto]==2.15.1",
  "python-multipart==0.0.32",
  "redis==8.1.0",
  "reportlab==5.1.0",
  "SQLAlchemy==2.1.6",
  "structlog==26.1.0",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
  "moto[s3]==5.2.5",
  "mypy==2.4.1",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "ruff==0.17.3",
]
# Runs a real PostgreSQL without Docker; see docs/decisions/0001-local-run-without-docker.md
local = ["pixeltable-pgserver==0.7.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["agents/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ""

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4"]
ignore = ["B008", "E501"]  # the formatter owns line length; long docstrings are left as written

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
# db.get() returns Optional everywhere and callers hold a foreign key; see run.md limitations.
strict_optional = false
files = ["app"]

# Literal response fields are validated by Pydantic at runtime from CHECK-constrained columns.
[[tool.mypy.overrides]]
module = "app.api.v1.*"
disable_error_code = ["arg-type"]
